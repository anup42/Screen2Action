schema_version: 1
name: public_smoke_real_models
device: cuda_optional
model:
  profile: paper_reference
  embedding_dim: 256
  visual_feature_dim: 256
  graph_layers: 2
  graph_heads: 4
  graph_variant: paper_eq_v1
  command_layers: 6
  command_heads: 4
  command_ffn: 1024
  command_max_length: 64
  node_text_length: 16
  top_k: 8
  ssb_budget: 512
  crop_size: 192
  crop_tokens: 144
  semantic_crop_size: 224
training:
  stage: stage2_selector_retrieval
  epochs: 1
  global_batch_size: 256
  per_device_batch_size: 1
  seed: 17
  precision: auto
  new_head_lr: 0.0002
  pretrained_lr: 0.00002
  weight_decay: 0.05
  scheduler: cosine
  warmup_fraction: 0.05
  gradient_clip_norm: 1.0
  log_interval: 10
  validation_interval_epochs: 1
  validation_required: true
  checkpoint_interval_optimizer_steps: 100
  frozen_crop_warmup_epochs: 1
  max_commands: 32
  tensorboard: true
  gumbel_temperature_start: 1.0
  gumbel_temperature_end: 0.1
  gumbel_anneal_fraction: 0.8
  forced_positive_probability_first_two_epochs: 0.5
