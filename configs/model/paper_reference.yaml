schema_version: 1
name: paper_reference
device: cuda_optional
d: 256
command_layers: 6
graph_layers: 2
command_heads: 4
command_ffn: 1024
command_max_tokens: 64
node_text_max_tokens: 16
retrieval_top_k: 8
ssb_budget: 512
crop_size: 192
crop_tokens: 144
model_registry: configs/models/registry.yaml
model_lock: configs/models/lock.json
graph_attention_variant: paper_eq_v1
relation_reranker_variant: paper_eq_v1
node_text_strategy: shared_wordpiece
command_encoder: compact_bert_locked_auto
crop_encoder: mobilevit_s_locked_timm
perception:
  detector: screenparser_yolo11_l_locked
  ocr: doctr_crnn_vgg16_bn_locked
  icon_classifier: mobilenetv3_small_locked_shared_heads
  icon_classes: 87
  actionability_labels: 4
grounding:
  sparse_blocks: 2
  attention_heads: 4
  crop_expansion_fraction: 0.12
  confidence_target: grounding_correctness_v1
  confidence_loss_enabled: true
  confidence_warmup_steps: 0
  confidence_refresh_interval: 1
training:
  stage_epochs: [12, 8, 6]
  new_head_lr: 0.0002
  pretrained_encoder_lr: 0.00002
  weight_decay: 0.05
  warmup_fraction: 0.05
  gradient_clip_norm: 1.0
  global_command_batch_size: 256
  ui_contrastive_temperature: 0.07
  ocr_frozen_after_perception: true
notes:
  - CUDA is optional at this milestone; CPU interfaces remain supported.
  - Pretrained detector/OCR/icon weights and the 87-class manifest are not bundled.
