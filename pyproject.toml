[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "screen2action"
version = "0.1.0"
description = "CPU-first structured semantic bottleneck for GUI grounding"
readme = "README.md"
requires-python = ">=3.12"
authors = [{name = "Screen2Action contributors"}]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
cpu = ["torch>=2.2"]
perception = [
  "huggingface-hub>=0.23",
  "numpy>=1.26",
  "Pillow>=10.0",
  "python-doctr[torch]>=0.10",
  "timm>=1.0",
  "torchvision>=0.17",
  "transformers>=4.40",
  "ultralytics>=8.3",
]
data = [
  "datasets>=2.18",
  "numpy>=1.26",
  "Pillow>=10.0",
  "pyarrow>=15.0",
  "webdataset>=0.2.86",
]
train = ["tensorboard>=2.16"]
android-control = ["tensorflow>=2.16"]
dev = [
  "mypy>=1.10",
  "pytest>=8.0",
  "ruff>=0.6",
  "types-PyYAML>=6.0",
]
export = [
  "onnx>=1.15",
  "onnxruntime>=1.16",
]
all-no-torch = [
  "datasets>=2.18",
  "huggingface-hub>=0.23",
  "numpy>=1.26",
  "onnx>=1.15",
  "onnxruntime>=1.16",
  "Pillow>=10.0",
  "pyarrow>=15.0",
  "tensorboard>=2.16",
  "transformers>=4.40",
  "webdataset>=0.2.86",
]

[project.scripts]
screen2action = "screen2action.cli:main"
screen2action-verify = "screen2action.tools.verify:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra -m 'not network and not gpu'"
markers = [
  "network: opt-in test that accesses an official network source",
  "gpu: opt-in test that requires an available CUDA device",
  "integration_model: offline end-to-end model integration test",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_ignores = true
